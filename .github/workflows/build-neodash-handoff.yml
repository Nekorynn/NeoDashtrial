name: Build NeoDash with NeoLink handoff
on:
  push:
    branches: [work/neodash-neolink-handoff]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK and Pillow
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          python -m pip install --disable-pip-version-check Pillow
      - name: Extract NeoDash source
        run: |
          unzip -tq build-input/NeoDash-Sleek-v0.3.0-GitHub-Build-Source.zip
          unzip -q build-input/NeoDash-Sleek-v0.3.0-GitHub-Build-Source.zip -d build-source
      - name: Apply original icon and dashboard patches
        run: |
          python build-input/patch_chrome_neon.py build-source/NeoDash-Sleek-v0.3.0
          gzip -dc build-input/patch_neodash_032.py.gz > /tmp/patch_neodash_032.py
          python /tmp/patch_neodash_032.py build-source/NeoDash-Sleek-v0.3.0
      - name: Add NeoLink handoff
        run: python build-input/patch_neolink_handoff.py build-source/NeoDash-Sleek-v0.3.0
      - name: Build debug APK
        run: gradle --no-daemon -p build-source/NeoDash-Sleek-v0.3.0 clean assembleDebug
      - name: Verify and upload
        run: |
          APK="build-source/NeoDash-Sleek-v0.3.0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" NeoDash-NeoLink-handoff-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NeoDash-NeoLink-handoff-debug
          path: NeoDash-NeoLink-handoff-debug.apk
          if-no-files-found: error
          retention-days: 30
