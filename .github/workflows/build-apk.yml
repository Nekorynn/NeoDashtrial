name: Build NeoDash 0.3.1 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 34 and Pillow
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          python -m pip install --disable-pip-version-check Pillow
      - name: Generate Chrome + Neon icons and build
        run: |
          python build-input/patch_chrome_neon.py .
          gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NeoDash-0.3.1-Chrome-Neon-Icons-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
