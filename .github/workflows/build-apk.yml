name: Build NeoDash 0.3.2 Cyberpunk Dashboard APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public build source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 34 and Pillow
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          python -m pip install --disable-pip-version-check Pillow

      - name: Verify and extract NeoDash source archive
        run: |
          unzip -tq build-input/NeoDash-Sleek-v0.3.0-GitHub-Build-Source.zip
          unzip -q build-input/NeoDash-Sleek-v0.3.0-GitHub-Build-Source.zip -d build-source

      - name: Apply Chrome + Neon app icon pack
        run: python build-input/patch_chrome_neon.py build-source/NeoDash-Sleek-v0.3.0

      - name: Apply NeoDash 0.3.2 onboarding and dashboard
        run: |
          gzip -dc build-input/patch_neodash_032.py.gz > /tmp/patch_neodash_032.py
          python /tmp/patch_neodash_032.py build-source/NeoDash-Sleek-v0.3.0

      - name: Build debug APK
        run: gradle --no-daemon -p build-source/NeoDash-Sleek-v0.3.0 clean assembleDebug

      - name: Verify and name APK
        run: |
          APK="build-source/NeoDash-Sleek-v0.3.0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" NeoDash-0.3.2-Cyberpunk-Dashboard-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoDash-0.3.2-Cyberpunk-Dashboard-debug
          path: NeoDash-0.3.2-Cyberpunk-Dashboard-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.2 NeoDash-0.3.2-Cyberpunk-Dashboard-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.3.2 NeoDash-0.3.2-Cyberpunk-Dashboard-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "NeoDash 0.3.2 - Blue Chrome Cyberpunk" \
              --notes "NeoDash 0.3.2 preview APK. Adds first-launch permission onboarding, configurable map and phone receiver apps, remembered media source, two-pane dashboard and blue-chrome cyberpunk styling. The embedded map pane uses OpenStreetMap; the selected installed map app is opened for full navigation. Debug-signed build for testing." \
              --target "$GITHUB_SHA"
          fi
