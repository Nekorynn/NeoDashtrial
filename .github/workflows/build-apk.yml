name: Build NeoDash and NeoLink APKs

on:
  push:
    branches: [main, 'architecture/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public build source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 34 and Pillow
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          python -m pip install --disable-pip-version-check Pillow

      - name: Verify and extract NeoDash source archive
        run: |
          unzip -tq build-input/NeoDash-Sleek-v0.3.0-GitHub-Build-Source.zip
          unzip -q build-input/NeoDash-Sleek-v0.3.0-GitHub-Build-Source.zip -d build-source

      - name: Apply Chrome + Neon app icon pack
        run: python build-input/patch_chrome_neon.py build-source/NeoDash-Sleek-v0.3.0

      - name: Apply NeoDash 0.3.2 onboarding and dashboard
        run: |
          gzip -dc build-input/patch_neodash_032.py.gz > /tmp/patch_neodash_032.py
          python /tmp/patch_neodash_032.py build-source/NeoDash-Sleek-v0.3.0

      - name: Apply NeoDash and NeoLink architecture separation
        if: startsWith(github.ref, 'refs/heads/architecture/')
        run: python build-input/patch_neolink_architecture.py

      - name: Diagnose clock and media implementation before build
        if: startsWith(github.ref, 'refs/heads/architecture/')
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("build-source/NeoDash-Sleek-v0.3.0/app/src/main/java")
          pattern = re.compile(r"time.?sync|ntp|network.?time|clock|media.?session|media.?metadata|album.?art|artwork|playback|transport.?controls|ACTION_PLAY|ACTION_PAUSE|ACTION_NEXT|ACTION_PREVIOUS", re.I)
          for path in sorted(root.rglob("*.java")):
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              hits = [i for i, line in enumerate(lines) if pattern.search(line)]
              if not hits:
                  continue
              print(f"\\n===== {path} =====")
              shown = set()
              for hit in hits:
                  start, end = max(0, hit - 3), min(len(lines), hit + 4)
                  if any(i in shown for i in range(start, end)):
                      continue
                  for i in range(start, end):
                      print(f"{i+1}: {lines[i]}")
                      shown.add(i)
          PY
      - name: Diagnose installed-app drawer implementation
        if: startsWith(github.ref, 'refs/heads/architecture/')
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("build-source/NeoDash-Sleek-v0.3.0/app/src/main/java/com/neodash/launcher/MainActivity.java")
          lines = p.read_text(encoding="utf-8").splitlines()
          pattern = re.compile(r"getInstalled|queryIntent|CATEGORY_LAUNCHER|loadIcon|loadLabel|ALL APPS|allApps|appGrid|app_grid|buildApps|showApps|appsContainer|appsGrid|installedApps|app drawer", re.I)
          hits = [i for i, line in enumerate(lines) if pattern.search(line)]
          print("APP DRAWER MATCHES:", len(hits))
          shown = set()
          for hit in hits:
              start, end = max(0, hit - 12), min(len(lines), hit + 25)
              if any(i in shown for i in range(start, end)):
                  continue
              print(f"\\n===== MainActivity.java:{start+1}-{end} =====")
              for i in range(start, end):
                  print(f"{i+1}: {lines[i]}")
                  shown.add(i)
          if not hits:
              for i, line in enumerate(lines):
                  if re.search(r"private .*\\(", line):
                      print(f"{i+1}: {line}")
          print("\\n===== FULL ALL APPS METHOD =====")
          for i in range(1458, min(len(lines), 1525)):
              print(f"{i+1}: {lines[i]}")
          PY

      - name: Verify architecture boundaries
        if: startsWith(github.ref, 'refs/heads/architecture/')
        run: |
          MAIN="build-source/NeoDash-Sleek-v0.3.0/app/src/main/java/com/neodash/launcher/MainActivity.java"
          SERVICE="build-source/NeoDash-Sleek-v0.3.0/app/src/main/java/com/neodash/launcher/NeoDashSystemStatusService.java"
          test -s "$SERVICE"
          ! grep -Eq 'launchMobileForDetectedPhone|ACTION_RECEIVER_SESSION|ios_app_package|android_app_package' "$MAIN"
          ! grep -Eq 'ACTION_RECEIVER_SESSION|receiverSessionActive|ACTION_USB_DEVICE_ATTACHED|ACTION_CONNECTION_STATE_CHANGED' "$SERVICE"
          grep -q 'NEOLINK_MSG_REGISTER' "$MAIN"
          grep -q 'NEOLINK_MSG_EVENT' "$MAIN"
      - name: Build debug APK
        run: gradle --no-daemon -p build-source/NeoDash-Sleek-v0.3.0 clean assembleDebug

      - name: Verify and name NeoDash 0.4.1 UI and typography APK
        if: startsWith(github.ref, 'refs/heads/architecture/')
        run: |
          APK="build-source/NeoDash-Sleek-v0.3.0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" NeoDash-0.4.1-UI-Typography-Preview-debug.apk

      - name: Upload NeoDash 0.4.0 architecture artifact
        if: startsWith(github.ref, 'refs/heads/architecture/')
        uses: actions/upload-artifact@v4
        with:
          name: NeoDash-0.4.1-UI-Typography-Preview-debug
          path: NeoDash-0.4.1-UI-Typography-Preview-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify and name NeoDash 0.3.2 stable APK
        if: github.ref == 'refs/heads/main'
        run: |
          APK="build-source/NeoDash-Sleek-v0.3.0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" NeoDash-0.3.2-Cyberpunk-Dashboard-debug.apk

      - name: Upload NeoDash 0.3.2 stable artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: NeoDash-0.3.2-Cyberpunk-Dashboard-debug
          path: NeoDash-0.3.2-Cyberpunk-Dashboard-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build independent NeoLink APK
        if: startsWith(github.ref, 'refs/heads/architecture/')
        run: gradle --no-daemon -p NeoLink clean assembleDebug

      - name: Verify and name NeoLink APK
        if: startsWith(github.ref, 'refs/heads/architecture/')
        run: |
          APK="NeoLink/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" NeoLink-0.1.0-Architecture-Preview-debug.apk

      - name: Upload NeoLink APK artifact
        if: startsWith(github.ref, 'refs/heads/architecture/')
        uses: actions/upload-artifact@v4
        with:
          name: NeoLink-0.1.0-Architecture-Preview-debug
          path: NeoLink-0.1.0-Architecture-Preview-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish NeoDash 0.4.0 architecture preview
        if: startsWith(github.ref, 'refs/heads/architecture/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v0.4.1-ui-typography-preview"
          ASSETS="NeoDash-0.4.1-UI-Typography-Preview-debug.apk NeoLink-0.1.0-Architecture-Preview-debug.apk"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" $ASSETS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" $ASSETS \
              --repo "$GITHUB_REPOSITORY" \
              --title "NeoDash 0.4.1 — UI & Typography Preview" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes "NeoDash 0.4.1 UI and typography preview for Android 8.1/API 27 and newer. Includes refined typography, clearer text hierarchy, larger readable labels, and polished dashboard surfaces. Separate NeoLink companion APK. Debug-signed builds for testing; not a stable release."
          fi

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.2 NeoDash-0.3.2-Cyberpunk-Dashboard-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.3.2 NeoDash-0.3.2-Cyberpunk-Dashboard-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "NeoDash 0.3.2 - Blue Chrome Cyberpunk" \
              --notes "NeoDash 0.3.2 preview APK. Adds first-launch permission onboarding, configurable map and phone receiver apps, remembered media source, two-pane dashboard and blue-chrome cyberpunk styling. The embedded map pane uses OpenStreetMap; the selected installed map app is opened for full navigation. Debug-signed build for testing." \
              --target "$GITHUB_SHA"
          fi
